<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="css/style.css"><title>네물내산 | 결제</title></head><body><div id="hdr"></div>
<main class="wrap"><div id="done" hidden></div><div id="co"><h1>결제</h1><div class="two">
<form class="f" id="f"><label>받는 분<input name="name" required></label><label>연락처<input name="phone" type="tel" required placeholder="010-0000-0000"></label>
<label>주소<input name="address" required></label><label>배송 메모<textarea name="memo" rows="2"></textarea></label>
<label>결제 수단<select name="pay"><option>신용/체크카드</option><option>계좌이체</option><option>카카오페이</option></select></label>
<p class="muted">※ 연습용 화면이에요. 실제 결제는 되지 않아요 (실결제는 PG 연동 필요).</p></form>
<aside class="sum" id="sum"></aside></div></div></main><script src="js/api.js"></script><script src="js/common.js"></script>
<script>
header();
let items = [];
(async () => {
  items = await cartItems(); const c = calc(items);
  if (!items.length) return document.querySelector('#co').innerHTML = '<p class="empty">결제할 상품이 없어요. <a href="index.html" style="color:var(--ac)">홈으로</a></p>';
  document.querySelector('#sum').innerHTML = items.map(({p, qty}) => `<div><span>${p.name} × ${qty}</span><span>${won(salePrice(p) * qty)}</span></div>`).join('') +
  `<div><span>배송비</span><span>${c.ship ? won(c.ship) : '무료'}</span></div>${c.disc ? `<div><span>쿠폰 할인</span><span>-${won(c.disc)}</span></div>` : ''}
  <div class="tot"><span>최종 금액</span><span>${won(c.total)}</span></div><button class="btn pri big" form="f">${won(c.total)} 결제하기</button>`;
})();
document.querySelector('#f').onsubmit = async e => {
  e.preventDefault(); const c = calc(items), d = Object.fromEntries(new FormData(e.target));
  const o = await api.createOrder({ ...d, total: c.total });
  document.querySelector('#co').hidden = true; updateBadges();
  const done = document.querySelector('#done'); done.hidden = false;
  done.innerHTML = `<h1>주문이 완료됐어요 🎉</h1><p>주문번호 ${o.id}</p><p>결제 금액 ${won(o.total)} · ${o.pay}</p><a class="btn pri" href="index.html">쇼핑 계속하기</a>`;
};
</script></body></html>
